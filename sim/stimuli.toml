# The stimulus–response rules of the world (stimres, see docs/adr/0001).
# Every effect on objects, NPCs, the player, blocks and liquids is a
# stimulus from here or from the sim, and every reaction is a receptron.
# Intensity: liquids cells poured (spill) or 0 for a wetting; pierce
# damage; noise loudness; fire >= 1 burns people, > 0 is open flame,
# 0 heat; flash ticks blinded.

[stim.impact]
[stim.pierce]
parent = "impact"
[stim.bash]
parent = "impact"
[stim.kick]
parent = "impact"
[stim.slam]
parent = "impact"
[stim.blast]
[stim.water]
[stim.oil]
[stim.fire]
[stim.shock]
[stim.flash]
[stim.noise]      # sound: medium "sound", Extra sound = what it is
[stim.visibility] # the player being seen: medium "sight"
[stim.body]       # a body lying about being seen
[stim.blaze]      # a fire being seen
[stim.frob]       # deliberate use: Extra held = the use key is held down
[stim.flicker]    # a burning cell's own tick
[stim.seep]       # a spill's own tick: the next cell pours
[stim.drip]       # a running faucet's own tick
[stim.step]       # a footstep on a cell (Intensity: the stride's loudness factor)
[stim.scorch]     # a burning person's own tick
[stim.slip]       # oil underfoot
[stim.dark]       # a light someone put out, seen: medium "sight"
[stim.spill]      # a puddle seen: medium "sight"
[stim.mop]        # a servant wiping up a puddle cell
[stim.fall]       # a body landing (Intensity: blocks fallen)
[stim.crush]      # a falling structure striking what is under it
[stim.poison]     # a vial poured into food or drink; poisoned food eaten
[stim.eat]        # an NPC eating or drinking (Source: the NPC)
[stim.land]       # something thrown landing, to itself

# ---- Objects ----

[archetype.object]

[archetype.torch]
parent = "object"
[[archetype.torch.receptron]]
stim = "water"
if = ["lit"]
effects = ["call douse", "set out true"]
[[archetype.torch.receptron]]
stim = "fire"
if = ["!lit"]
effects = ["clear out", "call kindle"]
[[archetype.torch.receptron]]
stim = "blast"
if = ["!held"]
effects = ["destroy"]
[[archetype.torch.receptron]]
stim = "frob"
if = ["!$held", "!carried"]
effects = ["call take_torch"]
[[archetype.torch.source]] # lying lit, it keeps at what it landed by
stim = "fire"
medium = "radius"
intensity = 0.5
range = 1.2
period = 40
if = ["lit", "fallen", "!held", "!flying"]
[[archetype.torch.source]] # put out where it hangs: guards notice and relight it
stim = "dark"
medium = "sight"
intensity = 1
period = 20
if = ["out", "!lit", "!fallen", "!held"]

[archetype.lantern]
parent = "torch"

[archetype.flammable]
parent = "object"
meta = ["burns"]

[meta.burns] # catches fire, burns for a while, then is burnt
[[meta.burns.receptron]]
stim = "water"
if = ["burning"]
effects = ["call douse"]
[[meta.burns.receptron]]
stim = "fire"
if = ["!burning", "!burnt"]
effects = ["set burning true 600", "set smoulder true 60", "call kindle"]
[[meta.burns.receptron]]
stim = "expired"
if = ["$prop == smoulder", "burning"]
effects = ["emit fire 0 radius 2.2"] # the heat spreads further
[[meta.burns.receptron]]
stim = "expired"
if = ["$prop == burning"]
effects = ["set burnt true", "call light_off"]
[[meta.burns.source]]
stim = "noise"
medium = "sound"
intensity = 30
period = 30
if = ["burning"]
extra = { sound = "fire" }
[[meta.burns.source]] # flames in view
stim = "blaze"
medium = "sight"
intensity = 1
period = 1
if = ["burning"]
[[meta.burns.source]] # flames: burn what stands in them
stim = "fire"
medium = "radius"
intensity = 1
range = 0.6
period = 10
if = ["burning"]

[archetype.lamp]
parent = "object"
[[archetype.lamp.receptron]]
stim = "water"
if = ["lit"]
effects = ["call short_out"]
[[archetype.lamp.receptron]]
stim = "blast"
if = ["!held"]
effects = ["destroy"]
[[archetype.lamp.receptron]]
stim = "frob"
if = ["!$held", "!carried"]
effects = ["call take_torch"]

[archetype.street_lamp] # too big to carry or knock over
parent = "lamp"
[[archetype.street_lamp.receptron]]
stim = "frob"
effects = ["stop"]

[archetype.door]
parent = "object"
meta = ["burns"]
[[archetype.door.receptron]] # burnt through: an opening
stim = "expired"
if = ["$prop == burning"]
effects = ["emit noise 40 sound sound=crash", "destroy"]
[[archetype.door.receptron]]
stim = "blast"
effects = ["destroy"]
[[archetype.door.receptron]] # kicked in
stim = "kick"
if = ["!locked", "!open"]
effects = ["call open_door", "emit noise 40 sound sound=crash"]
[[archetype.door.receptron]]
stim = "frob"
if = ["locked"]
effects = ["call pick_lock", "stop"]
[[archetype.door.receptron]]
stim = "frob"
if = ["!$held"]
effects = ["call open_door"]

[archetype.chest]
parent = "object"
meta = ["burns"]
[[archetype.chest.receptron]] # burnt with what was in it
stim = "expired"
if = ["$prop == burning"]
effects = ["destroy"]
[[archetype.chest.receptron]]
stim = "frob"
effects = ["call frob_chest"]

[archetype.faucet]
parent = "object"
props = { liquid = "water" }
[[archetype.faucet.receptron]]
stim = "blast"
effects = ["destroy"]
[[archetype.faucet.receptron]]
stim = "frob"
if = ["!$held"]
effects = ["call toggle running", "emit noise 12 sound sound=squeak"]
[[archetype.faucet.receptron]]
stim = "drip"
effects = ["call spill 1 0.5"]
[[archetype.faucet.source]]
stim = "drip"
medium = "self"
period = 15
if = ["running"]
[[archetype.faucet.source]]
stim = "noise"
medium = "sound"
intensity = 14
period = 45
if = ["running"]
extra = { sound = "water" }

[archetype.loot]
parent = "object"
[[archetype.loot.receptron]]
stim = "frob"
if = ["!$held"]
effects = ["call take"]

[archetype.key]
parent = "loot"

[archetype.ammo]
parent = "loot"

[archetype.weapon] # a guard's, dropped as it went down
parent = "object"
[[archetype.weapon.receptron]]
stim = "frob"
effects = ["call take_weapon"]

[archetype.food] # NPCs eat it on their rounds; a vial poisons it for good
parent = "object"
[[archetype.food.receptron]]
stim = "poison"
if = ["!poisoned"]
effects = ["set poisoned true", "call poisoned"]
[[archetype.food.receptron]]
stim = "eat"
effects = ["call feed"]

[archetype.drink]
parent = "food"

[archetype.bottle] # taken, it is thrown or swung once
parent = "drink"
[[archetype.bottle.receptron]]
stim = "frob"
if = ["!$held"]
effects = ["call take_bottle"]
[[archetype.bottle.receptron]] # thrown: it shatters where it lands, loud enough to draw a guard
stim = "land"
effects = ["emit noise 45 sound sound=shatter", "destroy"]

[archetype.poison_vial]
parent = "ammo"
[[archetype.poison_vial.receptron]] # thrown: it breaks (what the poison does then is for later)
stim = "land"
effects = ["emit noise 20 sound sound=shatter", "destroy"]

[archetype.decor]
parent = "object"
[[archetype.decor.receptron]] # kicked over, if it is small enough
stim = "kick"
if = ["!toppled"]
effects = ["call topple", "emit noise 35 sound sound=crash"]

[archetype.barrel]
parent = "decor"
props = { liquid = "water" }
[[archetype.barrel.receptron]] # punctured: it splashes out around its foot
stim = "pierce"
effects = ["emit noise 18 sound sound=splash", "call spill 4 1"]
[[archetype.barrel.receptron]] # kicked over: it all runs out
stim = "kick"
if = ["!toppled"]
effects = ["call topple", "emit noise 35 sound sound=crash", "call spill 8 1", "stop"]
[[archetype.barrel.receptron]] # blown apart: it spills everything
stim = "blast"
effects = ["call spill 8 1", "destroy"]

[archetype.oil_barrel]
parent = "barrel"
meta = ["oil_filled"]

[meta.oil_filled]
props = { liquid = "oil" }

# ---- People ----

[archetype.npc]
props = { alertness = 1 }
[[archetype.npc.receptron]]
stim = "pierce"
effects = ["call wound", "call pin"]
[[archetype.npc.receptron]] # kicked: alive, out cold or dead, it flies
stim = "kick"
effects = ["call shove"]
[[archetype.npc.receptron]] # slammed into a wall or the floor: the hardest kills,
stim = "slam"               # the hard knock out
min = 22
effects = ["call kill player slammed", "stop"]
[[archetype.npc.receptron]]
stim = "slam"
min = 10
effects = ["call knock_out hard"]
[[archetype.npc.receptron]] # a long drop: off a roof kills, off a wall knocks out
stim = "fall"
min = 7
effects = ["call kill player fell", "stop"]
[[archetype.npc.receptron]]
stim = "fall"
min = 4
effects = ["call knock_out hard"]
[[archetype.npc.receptron]]
stim = "bash"
effects = ["call knock_out"]
[[archetype.npc.receptron]]
stim = "blast"
effects = ["call kill player blown up"]
[[archetype.npc.receptron]] # flames, not heat: clothes catch, it runs for water
stim = "fire"
min = 1
if = ["!burning"]
effects = ["set burning true 160", "call catch_fire_npc"]
[[archetype.npc.receptron]]
stim = "water"
if = ["burning"]
effects = ["clear burning", "emit noise 12 sound sound=hiss", "call doused_npc"]
[[archetype.npc.receptron]]
stim = "scorch"
effects = ["call scorch_npc"]
[[archetype.npc.receptron]]
stim = "slip"
if = ["!slipped"]
effects = ["call slip_npc", "set slipped true 40"]
[[archetype.npc.receptron]] # under a falling structure
stim = "crush"
effects = ["call crush_npc"]
[[archetype.npc.receptron]]
stim = "shock"
effects = ["call kill accident electrocuted"]
[[archetype.npc.receptron]]
stim = "noise"
effects = ["call hear"]
[[archetype.npc.receptron]]
stim = "flash"
effects = ["call blind"]
[[archetype.npc.receptron]]
stim = "visibility"
effects = ["call see"]
[[archetype.npc.receptron]]
stim = "body"
effects = ["call notice_body"]
[[archetype.npc.receptron]]
stim = "blaze"
effects = ["call notice_fire"]
[[archetype.npc.source]] # dead or out cold: whoever sees it raises the alarm
stim = "body"
medium = "sight"
intensity = 1
period = 1
if = ["down"]
[[archetype.npc.receptron]] # a comrade shaking it awake
stim = "frob"
if = ["$revive"]
effects = ["call revive", "stop"]
[[archetype.npc.receptron]]
stim = "frob"
if = ["!$held"]
effects = ["call frob_body"]
[[archetype.npc.receptron]]
stim = "expired"
if = ["$prop == blind"]
effects = ["call recover"]
[[archetype.npc.receptron]] # poisoned food eaten: ten seconds as if nothing happened,
stim = "poison"              # then it thrashes and dies
if = ["!poisoned", "!down"]
effects = ["set poisoned true 200"]
[[archetype.npc.receptron]]
stim = "expired"
if = ["$prop == poisoned", "!down"]
effects = ["set convulsing true 50", "emit noise 30 sound sound=pain"]
[[archetype.npc.receptron]]
stim = "expired"
if = ["$prop == convulsing", "!down"]
effects = ["call kill player poisoned"]
[[archetype.npc.receptron]] # whatever else strikes it and leaves it standing
stim = "impact"
effects = ["call startle"]
[[archetype.npc.source]] # on fire: it burns, and sets alight what it brushes
stim = "scorch"
medium = "self"
period = 10
if = ["burning"]
[[archetype.npc.source]]
stim = "fire"
medium = "radius"
intensity = 0.5
range = 0.3
period = 10
if = ["burning"]
[[archetype.npc.source]]
stim = "blaze"
medium = "sight"
intensity = 1
period = 5
if = ["burning"]

[archetype.guard]
parent = "npc"
[[archetype.guard.receptron]]
stim = "dark"
effects = ["call notice_dark"]
[archetype.civilian]
parent = "npc"
[[archetype.civilian.receptron]]
stim = "spill"
effects = ["call notice_spill"]
[archetype.target]
parent = "npc"

[archetype.player]
props = { health = 20 }
[[archetype.player.receptron]]
stim = "crush"
effects = ["call crush_player"]
[[archetype.player.receptron]]
stim = "fall"
min = 4
effects = ["call fall_player"]
[[archetype.player.receptron]]
stim = "shock"
effects = ["call hurt 20 Electrocuted."]
[[archetype.player.receptron]] # flames, not heat: on fire until it burns out or water
stim = "fire"
min = 1
if = ["!burning"]
effects = ["call catch_fire_player", "set burning true 100"]
[[archetype.player.receptron]]
stim = "water"
if = ["burning"]
effects = ["clear burning", "emit noise 12 sound sound=hiss", "call doused_player"]
[[archetype.player.receptron]]
stim = "scorch"
effects = ["call hurt 2 Burned alive."]
[[archetype.player.receptron]]
stim = "slip"
if = ["!slipped"]
effects = ["call slip_player", "set slipped true 40"]
[[archetype.player.source]]
stim = "scorch"
medium = "self"
period = 10
if = ["burning"]
[[archetype.player.receptron]] # a guard's blade or bolt; Extra why is the epitaph
stim = "pierce"
effects = ["call strike"]
[[archetype.player.receptron]] # a guard's fist or crossbow stock
stim = "bash"
if = ["$why"]
effects = ["call strike"]
[[archetype.player.receptron]]
stim = "flash"
effects = ["call dazzle"]
[[archetype.player.receptron]]
stim = "blast"
effects = ["call caught_in_blast"]
[[archetype.player.source]] # how lit the player is (the light gem): NPCs look
stim = "visibility"
medium = "sight"
intensity = 1
period = 1

# ---- Cells ----

[archetype.cell]
[[archetype.cell.receptron]] # glass, TNT and liquids stop it first
stim = "blast"
effects = ["call blast_block"]
[[archetype.cell.receptron]]
stim = "flicker"
effects = ["call fire_tick"]
[[archetype.cell.source]] # a fire burning here: it ages and spreads
stim = "flicker"
medium = "self"
period = 1
if = ["burning"]
[[archetype.cell.receptron]]
stim = "seep"
effects = ["call seep"]
[[archetype.cell.source]] # a spill spreading from here, a cell at a time
stim = "seep"
medium = "self"
period = 6
if = ["spill_left > 0"]
[[archetype.cell.receptron]] # walked on: as loud as what it is
stim = "step"
effects = ["call footstep"]
[[archetype.cell.receptron]] # a liquid landing here pools
stim = "water"
min = 1
effects = ["call pour"]
[[archetype.cell.receptron]]
stim = "oil"
min = 1
effects = ["call pour"]

[archetype.solid]
parent = "cell"

[archetype.air] # air, or an invisible light: where fire burns
parent = "cell"
[[archetype.air.receptron]]
stim = "water"
if = ["burning"]
effects = ["call douse_fire"]
[[archetype.air.receptron]]
stim = "fire"
if = ["!burning"]
effects = ["call catch_fire"]

[archetype.glass]
parent = "cell"
[[archetype.glass.receptron]] # as loud as a bomb
stim = "impact"
effects = ["emit noise 50 sound sound=shatter", "destroy"]
[[archetype.glass.receptron]]
stim = "blast"
effects = ["emit noise 50 sound sound=shatter", "destroy", "stop"]

[archetype.flammable_block]
parent = "cell"
[[archetype.flammable_block.receptron]]
stim = "fire"
effects = ["call burn_block"]

[archetype.creaky] # wooden stairs and ladders
parent = "flammable_block"
[[archetype.creaky.receptron]]
stim = "step"
effects = ["call footstep creak", "stop"]

[archetype.support] # a wooden support holding up a weak wall or balcony
parent = "flammable_block"
[[archetype.support.receptron]] # blows strain it until it breaks
stim = "impact"
effects = ["call strain", "stop"]
[[archetype.support.receptron]]
stim = "blast"
effects = ["call strain", "stop"]
[[archetype.support.receptron]] # burnt away
stim = "fire"
effects = ["call burn_block", "call support_broken", "stop"]

[archetype.spikes] # pointed dripstone: impales whatever is thrown onto it
parent = "cell"
[[archetype.spikes.receptron]]
stim = "slam"
effects = ["call impale"]

[archetype.tnt]
parent = "cell"
[[archetype.tnt.receptron]]
stim = "fire"
effects = ["call prime_tnt"]
[[archetype.tnt.receptron]]
stim = "blast"
effects = ["call prime_tnt", "stop"]

[archetype.water_puddle]
parent = "cell"
[[archetype.water_puddle.receptron]]
stim = "shock"
if = ["!live"]
effects = ["call electrify"]
[[archetype.water_puddle.source]] # live: it shocks whoever stands in it
stim = "shock"
medium = "radius"
intensity = 1
range = 0.2
period = 1
if = ["live"]
[[archetype.water_puddle.source]] # what lies in it gets wet
stim = "water"
medium = "radius"
period = 1
[[archetype.water_puddle.source]] # servants see the mess
stim = "spill"
medium = "sight"
intensity = 1
period = 40
[[archetype.water_puddle.receptron]] # wiping up a live puddle
stim = "mop"
if = ["live"]
effects = ["emit shock 1 radius 1"]
[[archetype.water_puddle.receptron]]
stim = "mop"
effects = ["destroy"]

[archetype.oil_puddle]
parent = "cell"
[[archetype.oil_puddle.receptron]]
stim = "fire"
if = ["!burning"]
effects = ["set burning true 160", "call ignite_oil"]
[[archetype.oil_puddle.receptron]]
stim = "water"
if = ["burning"]
effects = ["clear burning", "call unlight_above", "emit noise 12 sound sound=hiss"]
[[archetype.oil_puddle.receptron]]
stim = "mop"
if = ["!burning"]
effects = ["destroy"]
[[archetype.oil_puddle.source]] # slick underfoot
stim = "slip"
medium = "radius"
intensity = 1
range = 0.1
period = 2
if = ["!burning"]
[[archetype.oil_puddle.source]]
stim = "spill"
medium = "sight"
intensity = 1
period = 40
if = ["!burning"]
[[archetype.oil_puddle.receptron]] # burnt away
stim = "expired"
if = ["$prop == burning"]
effects = ["destroy"]
[[archetype.oil_puddle.source]] # flames: burn what stands in them, catch the next cell
stim = "fire"
medium = "radius"
intensity = 1
range = 0.6
period = 10
if = ["burning"]
[[archetype.oil_puddle.source]]
stim = "noise"
medium = "sound"
intensity = 30
period = 30
if = ["burning"]
extra = { sound = "fire" }
